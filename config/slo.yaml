service: day13-observability-lab
window: 28d
slis:
  latency_p95_ms:
    objective: 3000
    target: 99.5
    note: >-
      Baseline đo được P95 ≈ 1213 ms, nên ngưỡng 3000 ms cách baseline khoảng
      2.5x và không kêu vì nhiễu thường ngày. Khi bật incident rag_slow, P95 lên
      3730 ms và vượt ngưỡng đúng như mong đợi.
  error_rate_pct:
    objective: 2
    target: 99.0
    note: >-
      Baseline hiện tại 0%. Giữ objective 2% để còn error budget cho lỗi
      thoáng qua; alert elevated_error_rate dùng đúng ngưỡng này.
  daily_cost_usd:
    objective: 2.5
    target: 100.0
    note: >-
      Chi phí thực đo ≈ $0.002/request. Ngưỡng $2.5/ngày tương đương khoảng
      1250 request/ngày, đủ rộng cho lab và vẫn bắt được cost spike.
  quality_score_avg:
    objective: 0.75
    target: 95.0
    note: >-
      Quality proxy baseline 0.88. Ngưỡng 0.75 nằm dưới baseline một khoảng an
      toàn nên chỉ kêu khi chất lượng giảm thật, không kêu vì dao động nhỏ.
  latency_p95_ms_monitoring:
    objective: 2000
    target: 99.5
    note: >-
      Bổ sung sau CP3. Feature monitoring có baseline riêng ~150 ms, nhanh hơn
      nhiều mặt bằng chung, nên ngưỡng chung 3000 ms bỏ lọt sự cố của nó: khi
      chạy challenge day13-k4-observability-v1, P95 lên 2651 ms (chậm gấp ~17
      lần baseline) mà alert chung vẫn im. Ngưỡng 2000 ms lấy theo
      latency_threshold_ms trong config/challenge.json.
